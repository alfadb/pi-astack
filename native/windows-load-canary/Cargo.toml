[package]
name = "pi-astack-windows-load-canary"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test-only N-API load-order canary (NOT production; not in source closure / package manifest)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.12.0", default-features = false, features = ["napi9"] }
napi-derive = { version = "=3.6.2", default-features = false, features = ["strict"] }
ctor = "=0.2.9"

[build-dependencies]
napi-build = { version = "=2.4.0" }

[profile.release]
lto = false
codegen-units = 16
strip = "symbols"
